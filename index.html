<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiEmail Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --pastel-bg: #f8f6ff;
            --pastel-purple: #c084fc;
            --pastel-pink: #f472b6;
            --pastel-blue: #60a5fa;
            --pastel-mint: #34d399;
            --pastel-card-bg: #ffffff;
        }

        body {
            background: linear-gradient(135deg, #fef2f2 0%, #f0fdf4 50%, #eff6ff 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #334155;
        }

        .header-title {
            background: linear-gradient(135deg, #8b5cf6, #ec4899, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.08);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
        }

        .form-control, .form-select {
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            padding: 0.75rem 1rem;
            background-color: #fafafc;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: #c084fc;
            box-shadow: 0 0 0 4px rgba(192, 132, 252, 0.2);
            background-color: #ffffff;
        }

        .btn-pastel {
            background: linear-gradient(135deg, #a78bfa, #f472b6);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-pastel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 114, 182, 0.35);
            color: white;
        }

        .btn-copy {
            background-color: #e0e7ff;
            color: #4338ca;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-copy:hover {
            background-color: #c7d2fe;
            color: #3730a3;
        }

        .preview-box {
            background-color: #fafafc;
            border-left: 5px solid #a78bfa;
            border-radius: 12px;
        }

        .badge-accent {
            background: #f3e8ff;
            color: #7e22ce;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="py-5">

<div class="container">
    <!-- Header Section -->
    <div class="text-center mb-5">
        <h1 class="display-5 header-title mb-2">
            <i class="fa-solid fa-wand-magic-sparkles me-2" style="color: #ec4899;"></i>AiEmail Generator
        </h1>
        <p class="text-muted fw-medium">Draft polished, high-converting emails in seconds with vibrant intelligence</p>
    </div>

    <div class="row g-4">
        <!-- Input Form -->
        <div class="col-lg-5">
            <div class="card p-4">
                <div class="d-flex align-items-center mb-3">
                    <span class="badge-accent me-2"><i class="fa-solid fa-sliders me-1"></i> Input</span>
                    <h5 class="fw-bold m-0">Email Details</h5>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">RECIPIENT ROLE / NAME</label>
                    <input type="text" id="recipient" class="form-control" placeholder="e.g. Hiring Manager, Client, Alex">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">TONE</label>
                    <select id="tone" class="form-select">
                        <option value="Professional & Formal">Professional & Formal</option>
                        <option value="Friendly & Warm">Friendly & Warm</option>
                        <option value="Persuasive & Direct">Persuasive & Direct</option>
                        <option value="Urgent & Action-Oriented">Urgent & Action-Oriented</option>
                        <option value="Apologetic & Empathetic">Apologetic & Empathetic</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">PRIMARY PURPOSE</label>
                    <input type="text" id="purpose" class="form-control" placeholder="e.g. Following up on Q3 report review">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">KEY POINTS TO INCLUDE</label>
                    <textarea id="key_points" class="form-control" rows="3" placeholder="- Completed initial draft&#10;- Requesting approval by Friday&#10;- Attached updated metrics"></textarea>
                </div>

                <button id="generateBtn" class="btn btn-pastel w-100 mt-2" onclick="generateEmail()">
                    <span id="btnText"><i class="fa-solid fa-paper-plane me-2"></i>Generate Draft</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </div>
        </div>

        <!-- Output Preview -->
        <div class="col-lg-7">
            <div class="card p-4">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <div class="d-flex align-items-center">
                        <span class="badge-accent me-2"><i class="fa-solid fa-envelope me-1"></i> Preview</span>
                        <h5 class="fw-bold m-0">Generated Result</h5>
                    </div>
                    <button class="btn btn-copy btn-sm px-3" onclick="copyToClipboard()">
                        <i class="fa-regular fa-copy me-1"></i> Copy
                    </button>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">SUBJECT LINE</label>
                    <input type="text" id="outputSubject" class="form-control bg-light fw-bold text-dark" readonly placeholder="Your subject line will appear here...">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">EMAIL BODY</label>
                    <textarea id="outputBody" class="form-control preview-box p-3" rows="11" readonly placeholder="Your email draft will appear here..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function generateEmail() {
    const recipient = document.getElementById("recipient").value;
    const tone = document.getElementById("tone").value;
    const purpose = document.getElementById("purpose").value;
    const key_points = document.getElementById("key_points").value;

    if (!purpose.trim()) {
        alert("Please enter the primary purpose of the email.");
        return;
    }

    document.getElementById("btnText").classList.add("d-none");
    document.getElementById("btnSpinner").classList.remove("d-none");
    document.getElementById("generateBtn").disabled = true;

    try {
        const response = await fetch("/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ recipient, tone, purpose, key_points })
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById("outputSubject").value = data.subject;
            document.getElementById("outputBody").value = data.body;
        } else {
            alert("Error: " + (data.error || "Failed to generate email."));
        }
    } catch (err) {
        alert("Request failed. Please check your connection or server status.");
    } finally {
        document.getElementById("btnText").classList.remove("d-none");
        document.getElementById("btnSpinner").classList.add("d-none");
        document.getElementById("generateBtn").disabled = false;
    }
}

function copyToClipboard() {
    const subject = document.getElementById("outputSubject").value;
    const body = document.getElementById("outputBody").value;
    
    if (!subject && !body) return;

    const fullText = `Subject: ${subject}\n\n${body}`;
    navigator.clipboard.writeText(fullText);
    alert("Copied subject and email body to clipboard!");
}
</script>
</body>
</html>
